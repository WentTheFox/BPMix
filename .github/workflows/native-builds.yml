name: Native builds

# Windows and Android runners cost more (and take longer) than the Docker
# publish job's Linux containers - Windows runners specifically bill at 2x
# the included per-minute rate - so this only runs on a version tag or when
# triggered by hand, never on every push to main.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No --filter here (unlike Dockerfile's web/server-only install) -
      # the Android build genuinely needs apps/mobile's own dependencies
      # (react-native, its native modules) installed.
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Stamps the real commit into the About screen's build info (see
      # packages/core/src/buildInfo.ts) - assembleRelease is invoked
      # directly below, not through apps/mobile's own "android" pnpm
      # script, so its preandroid hook never runs otherwise.
      - name: Generate build info
        env:
          GIT_COMMIT_OVERRIDE: ${{ github.sha }}
          GIT_VERSION_OVERRIDE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/generate-build-info.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/bpmix-release.keystore"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bpmix-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bpmix-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    # Not windows-latest: confirmed live (this exact run) that it now
    # resolves to a VS "18" image, which only has Windows SDK/toolset
    # versions this react-native-windows version doesn't target - the same
    # class of problem CLAUDE.md's Windows housekeeping note already
    # describes on the user's own machine (only VS2022 is supported here).
    # windows-2022 keeps the classic VS2022 toolchain this project needs.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate build info
        env:
          GIT_COMMIT_OVERRIDE: ${{ github.sha }}
          GIT_VERSION_OVERRIDE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/generate-build-info.mjs

      - uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore apps/mobile/windows/Mobile.sln

      # Unsigned MSIX (AppxPackageSigningEnabled=false) - this repo has no
      # code-signing certificate for Windows yet, unlike Android's now-real
      # release keystore. SideloadOnly still produces an installable
      # package for manual/test installs; it just isn't Store- or
      # enterprise-distribution ready.
      #
      # PlatformToolset=v143 overrides apps/mobile/windows/Mobile/Mobile.vcxproj's
      # own <PlatformToolset>v145</PlatformToolset> (confirmed live: MSB8020,
      # "build tools for v145 cannot be found") - v145 only exists on
      # whatever newer/preview VS the project was last retargeted against
      # locally; v143 is the toolset react-native-windows 0.85.0-preview.1
      # actually targets and what windows-2022's classic VS2022 Enterprise
      # ships. A command-line /p: override beats the project file's own
      # value without touching that file (and whatever local Windows dev
      # setup depends on it) - see CLAUDE.md's Windows housekeeping note for
      # the same VS-version class of problem on the user's own machine.
      - name: Build
        run: >
          msbuild apps/mobile/windows/Mobile.sln
          /p:Configuration=Release /p:Platform=x64
          /p:PlatformToolset=v143
          /p:AppxBundlePlatforms=x64
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=false
          /m

      - uses: actions/upload-artifact@v4
        with:
          name: bpmix-windows-x64
          path: apps/mobile/windows/Mobile.Package/AppPackages/**
          if-no-files-found: error

  # Only for a real version-tag build (a workflow_dispatch run against a
  # branch has no version to name a release after) - covers both a tag
  # push and a manual dispatch explicitly run against a tag ref, since
  # both land here as github.ref_type == 'tag'. needs: [android, windows]
  # means this is skipped outright if either build failed, so a release
  # never ships with only one platform's artifact attached.
  release:
    needs: [android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The Android artifact is already just the .apk. The Windows one is
      # AppPackages' whole per-build "_Test" folder (see AppxBundle=Always
      # above) - the .msixbundle alone isn't enough to sideload-install;
      # Install.ps1 and the Dependencies/ redistributables (VCLibs,
      # WindowsAppRuntime) next to it are what actually make that work, so
      # the release gets both the bare .msixbundle (for anyone who already
      # has the dependencies and just wants the package) and a zip of the
      # whole folder (for an actual first-time sideload install).
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          assets_dir="$(pwd)/release-assets"
          cp artifacts/bpmix-android-release-apk/*.apk release-assets/
          windows_dir=$(find artifacts/bpmix-windows-x64 -mindepth 1 -maxdepth 1 -type d | head -1)
          cp "$windows_dir"/*.msixbundle release-assets/
          (cd "$(dirname "$windows_dir")" && zip -rq "$assets_dir/bpmix-windows-x64-sideload.zip" "$(basename "$windows_dir")")
          ls -la release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
