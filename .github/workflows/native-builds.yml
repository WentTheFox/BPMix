name: Native builds

# Windows and Android runners cost more (and take longer) than the Docker
# publish job's Linux containers - Windows runners specifically bill at 2x
# the included per-minute rate - so this only runs on a version tag or when
# triggered by hand, never on every push to main.
on:
  workflow_dispatch:
    inputs:
      # A manual test build usually only needs the platform being worked
      # on - skipping the other saves its runner time (and a tag build
      # always builds both, since a release needs both artifacts).
      platform:
        description: Which platform(s) to build
        type: choice
        options: [both, windows, android]
        default: both
  push:
    tags:
      - 'v*'

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone - apps/mobile/android/
      # app/build.gradle's versionCode is `git rev-list --count HEAD`,
      # which needs it, and buildInfo.ts's git describe needs real tag
      # history too (though GIT_VERSION_OVERRIDE below covers that one).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # No --filter here (unlike Dockerfile's web/server-only install) -
      # the Android build genuinely needs apps/mobile's own dependencies
      # (react-native, its native modules) installed.
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          # ~/.gradle/caches + wrapper: every run used to re-download the
          # whole Gradle dependency graph. Keyed on the Gradle files and the
          # pnpm lockfile, since native modules' build.gradle files live in
          # node_modules.
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
            pnpm-lock.yaml

      # The C++ half of the build (React Native itself plus native modules
      # like react-native-audio-api, for four ABIs) is most of the ~13 min.
      # CMake >= 3.17 picks up CMAKE_<LANG>_COMPILER_LAUNCHER from the
      # environment (see the build step), so every NDK compile goes through
      # ccache, and this action persists its cache between runs.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android-${{ hashFiles('pnpm-lock.yaml') }}
          max-size: 2G

      # Stamps the real commit into the About screen's build info (see
      # packages/core/src/buildInfo.ts) - assembleRelease is invoked
      # directly below, not through apps/mobile's own "android" pnpm
      # script, so its preandroid hook never runs otherwise.
      - name: Generate build info
        env:
          GIT_COMMIT_OVERRIDE: ${{ github.sha }}
          GIT_VERSION_OVERRIDE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/generate-build-info.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/bpmix-release.keystore"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bpmix-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Hash paths relative to the checkout, and ignore the build dir
          # CMake compiles from, so cache entries still hit when those
          # absolute paths differ between runs.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bpmix-android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    # Not windows-latest: confirmed live (this exact run) that it now
    # resolves to a VS "18" image, which only has Windows SDK/toolset
    # versions this react-native-windows version doesn't target - the same
    # class of problem CLAUDE.md's Windows housekeeping note already
    # describes on the user's own machine (only VS2022 is supported here).
    # windows-2022 keeps the classic VS2022 toolchain this project needs.
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate build info
        env:
          GIT_COMMIT_OVERRIDE: ${{ github.sha }}
          GIT_VERSION_OVERRIDE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/generate-build-info.mjs

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      # The restore below downloads WinAppSDK, Hermes, react-native-windows
      # etc. from scratch every run (~2 of the job's ~5 min) - these lock
      # files pin every NuGet package version, so they make a safe key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('apps/mobile/windows/**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Restore NuGet packages
        run: nuget restore apps/mobile/windows/BPMix.sln

      # Package.appxmanifest's Identity Version is checked in as a fixed
      # 1.0.0.0, and Add-AppxPackage won't install a different build over an
      # installed package with the same version - so a tag build stamps
      # vX.Y.Z in as X.Y.Z.0. Non-tag (workflow_dispatch) builds keep the
      # checked-in version.
      - name: Stamp package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v(\d+)\.(\d+)\.(\d+)') { throw "Tag ${{ github.ref_name }} isn't vX.Y.Z" }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $path = Resolve-Path 'apps/mobile/windows/BPMix.Package/Package.appxmanifest'
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = $version
          $manifest.Save($path)
          Write-Host "Package version: $version"

      # Self-signed code-signing certificate from
      # scripts/windows/New-SigningCertificate.ps1 (which also sets both
      # secrets); its subject must equal Package.appxmanifest's Publisher.
      # Windows refuses to install an unsigned MSIX at all - the release's
      # Install.cmd trusts this certificate on the user's machine first (see
      # scripts/windows/Install.ps1).
      - name: Decode signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64) { throw 'WINDOWS_SIGNING_PFX_BASE64 secret is not set' }
          [IO.File]::WriteAllBytes("${{ runner.temp }}\bpmix-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))

      # SideloadOnly, signed with the certificate above. The timestamp keeps
      # already-released packages installable after the certificate itself
      # expires; current signtool refuses a timestamp URL without an explicit
      # digest algorithm (/td), hence the second property.
      #
      # PlatformToolset=v143 overrides apps/mobile/windows/BPMix/BPMix.vcxproj's
      # own <PlatformToolset>v145</PlatformToolset> (confirmed live: MSB8020,
      # "build tools for v145 cannot be found") - v145 only exists on
      # whatever newer/preview VS the project was last retargeted against
      # locally; v143 is the toolset react-native-windows 0.85.0-preview.1
      # actually targets and what windows-2022's classic VS2022 Enterprise
      # ships. A command-line /p: override beats the project file's own
      # value without touching that file (and whatever local Windows dev
      # setup depends on it) - see CLAUDE.md's Windows housekeeping note for
      # the same VS-version class of problem on the user's own machine.
      - name: Build
        run: >
          msbuild apps/mobile/windows/BPMix.sln
          /p:Configuration=Release /p:Platform=x64
          /p:PlatformToolset=v143
          /p:AppxBundlePlatforms=x64
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=true
          "/p:PackageCertificateKeyFile=${{ runner.temp }}\bpmix-signing.pfx"
          "/p:PackageCertificatePassword=${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}"
          /p:AppxPackageSigningTimestampServerUrl=http://timestamp.digicert.com
          /p:AppxPackageSigningTimestampDigestAlgorithm=SHA256
          /m

      # The folder that becomes the release's sideload zip: the bundle, the
      # public half of the signing certificate, the x64 framework
      # dependencies (VCLibs, WindowsAppRuntime), and scripts/windows'
      # double-clickable Install.cmd. VS's own generated
      # Install.ps1/Add-AppDevPackage.ps1 are left out - they need an
      # execution-policy change just to start, and prompt about developer
      # licenses.
      - name: Assemble sideload package
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $testDir = Get-ChildItem apps/mobile/windows/BPMix.Package/AppPackages -Directory | Select-Object -First 1
          $bundle = Get-ChildItem $testDir -Filter '*.msixbundle' | Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle in $testDir" }
          $out = New-Item -ItemType Directory -Force 'windows-release/BPMix'
          Copy-Item $bundle.FullName $out
          New-Item -ItemType Directory -Force "$out/Dependencies" | Out-Null
          Copy-Item "$testDir/Dependencies/x64/*" "$out/Dependencies/"
          Copy-Item scripts/windows/Install.ps1, scripts/windows/Install.cmd $out
          $pfx = [Security.Cryptography.X509Certificates.X509Certificate2]::new("${{ runner.temp }}\bpmix-signing.pfx", $env:WINDOWS_SIGNING_PFX_PASSWORD)
          [IO.File]::WriteAllBytes("$out/BPMix.cer", $pfx.Export('Cert'))
          # Fail here rather than on a user's machine if the bundle somehow
          # came out unsigned.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try { if ($zip.Entries.FullName -notcontains 'AppxSignature.p7x') { throw 'msixbundle is not signed' } } finally { $zip.Dispose() }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bpmix-windows-x64
          path: windows-release/
          if-no-files-found: error

  # Only for a real version-tag build (a workflow_dispatch run against a
  # branch has no version to name a release after) - covers both a tag
  # push and a manual dispatch explicitly run against a tag ref, since
  # both land here as github.ref_type == 'tag'. needs: [android, windows]
  # means this is skipped outright if either build failed, so a release
  # never ships with only one platform's artifact attached.
  release:
    needs: [android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # The Android artifact is already just the .apk. The Windows one is the
      # sideload folder assembled in the windows job: the release gets it
      # zipped (the normal path - extract, double-click Install.cmd), plus
      # the bare .msixbundle and BPMix.cer for anyone who'd rather trust the
      # certificate and install by hand.
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          assets_dir="$(pwd)/release-assets"
          version="${{ github.ref_name }}"
          # mv, not cp: the source lives under artifacts/ (a download-artifact
          # scratch dir nothing else reads), so there's no reason to leave an
          # old-named copy sitting in release-assets/ alongside the renamed one.
          mv artifacts/bpmix-android-release-apk/*.apk "release-assets/bpmix-android-${version}.apk"
          windows_dir=$(find artifacts/bpmix-windows-x64 -mindepth 1 -maxdepth 1 -type d | head -1)
          # cp (not mv) here: $windows_dir's contents, including this
          # .msixbundle under its original name, still need to exist for the
          # zip step right below.
          cp "$windows_dir"/*.msixbundle "release-assets/bpmix-windows-${version}.msixbundle"
          cp "$windows_dir"/BPMix.cer release-assets/
          (cd "$(dirname "$windows_dir")" && zip -rq "$assets_dir/bpmix-windows-${version}-sideload.zip" "$(basename "$windows_dir")")
          # apps/mobile's in-app update flow (useAppUpdateCheck, @bpmix/core's
          # checkForUpdate) verifies the downloaded APK's own computed SHA-256
          # against this file before ever installing it - see
          # AppUpdateModule.kt's downloadFile. Generated after the renames
          # above so the hashes inside are keyed by the actual uploaded
          # filenames; checksums.txt itself keeps its literal name since
          # checkForUpdate.ts looks it up by that exact string.
          (cd release-assets && sha256sum * > checksums.txt)
          ls -la release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
