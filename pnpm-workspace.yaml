packages:
  - 'apps/*'
  - 'packages/*'

# Lets `pnpm --filter @bpmix/server deploy` (Dockerfile) hard-link its
# workspace:* dependency on @bpmix/core directly instead of falling back to
# the "legacy" deploy implementation, which re-resolves the ENTIRE
# workspace lockfile (all ~1200 packages, apps/mobile's native deps
# included) just to isolate one package's prod dependency tree.
injectWorkspacePackages: true

allowBuilds:
  # esbuild's postinstall only selects/downloads its own platform binary.
  esbuild: true
  # Only pulled in transitively by react-native-sqlite-2's websql dependency
  # for its Node.js-environment shim; the actual Android app talks to native
  # SQLite via the RN native module, not this Node addon.
  sqlite3: true

# Supply-chain safety net: don't let anything install until it's been
# public for at least 14 days, giving time for malicious/broken releases
# to be caught and unpublished.
minimumReleaseAge: 20160

patchedDependencies:
  '@react-native/gradle-plugin@0.85.0': patches/@react-native__gradle-plugin@0.85.0.patch
  react-native-scoped-storage: patches/react-native-scoped-storage.patch
